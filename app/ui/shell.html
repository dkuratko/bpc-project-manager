<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Build Play Contracting — Project Manager</title>
<link rel="stylesheet" href="win2000.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; }

  /* The frame. No menu, no toolbar — each child carries its own. */
  #frame-title {
    height: 20px; flex: none;
    background: linear-gradient(90deg, #000080, #1084d0);
    display: flex; align-items: center; gap: 6px; padding: 0 3px 0 5px;
    -webkit-app-region: drag;
  }
  #frame-title .name { color: #fff; font-weight: bold; flex: 1; white-space: nowrap; }
  #frame-title .btns { display: flex; gap: 2px; -webkit-app-region: no-drag; }

  /* The teal desk IS the client area. */
  #desk { flex: 1; position: relative; overflow: hidden; background: var(--desk); }
  #desk > .w-window { position: absolute; }
  .w-window.is-dragging { opacity: .92; }
  .w-titlebar.inactive { background: linear-gradient(90deg, #808080, #b5b5b5); }
</style>
</head>
<body>

<div id="frame-title">
  <span class="name">Build Play Contracting — Project Manager</span>
  <span class="btns">
    <span class="w-titlebtn" data-frame="minimize" title="Minimize">
      <span style="display:block;width:7px;height:2px;background:#000;margin-top:5px"></span></span>
    <span class="w-titlebtn" data-frame="maximize" title="Maximize">
      <span style="display:block;width:8px;height:7px;border:1px solid #000;border-top-width:2px"></span></span>
    <span class="w-titlebtn" data-frame="close" title="Close">
      <span style="position:absolute;width:9px;height:1px;background:#000;transform:rotate(45deg)"></span>
      <span style="position:absolute;width:9px;height:1px;background:#000;transform:rotate(-45deg)"></span></span>
  </span>
</div>

<div id="desk"></div>

<script type="module" src="shell.js"></script>
</body>
</html>
