<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estimate — Build Play Contracting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#e9eaec;font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
  .bar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;
    padding:10px 18px;background:#1c1c1a;color:#fff;font:600 13px 'IBM Plex Mono',monospace}
  .bar .rt{display:flex;align-items:center;gap:16px}
  .bar a{color:#c9c2b0;text-decoration:none;font-weight:400;font-size:12px}
  .bar button{font:600 13px 'IBM Plex Mono',monospace;padding:8px 16px;border:0;border-radius:5px;
    background:#e7e3d8;color:#1c1c1a;cursor:pointer}
  .bar button:hover{background:#d8d3c4}
  .page{box-shadow:0 2px 16px rgba(0,0,0,.16);margin:22px auto}
  .err{max-width:620px;margin:60px auto;padding:24px 28px;background:#fff;border-radius:8px;color:#333;line-height:1.5}
  @media print{ .bar{display:none} body{background:#fff} .page{box-shadow:none;margin:0} }
</style>
</head>
<body>
  <div class="bar">
    <span>Estimate preview</span>
    <span class="rt"><a href="index.html">← back to builder</a>
      <button onclick="window.print()">Save as PDF / Print</button></span>
  </div>
  <style id="pcss"></style>
  <div id="mount"><div class="err">Loading…</div></div>

  <script src="builder.data.js"></script>
  <script src="builder.print.js"></script>
  <script>
  (function(){
    var doc;
    try{ var raw=localStorage.getItem('bpc-builder-v1'); if(raw) doc=JSON.parse(raw); }catch(e){}
    if(!doc){ try{ doc=JSON.parse(JSON.stringify(SEED_DOC)); }catch(e){} }
    var mount=document.getElementById('mount');
    if(!doc || !window.BuilderPrint){
      mount.innerHTML='<div class="err"><b>Could not load the estimate.</b><br>'+
        'Make sure <code>builder.data.js</code> and <code>builder.print.js</code> are in the same folder as this file, and open it directly in your browser.</div>';
      return;
    }
    document.getElementById('pcss').textContent = BuilderPrint.CSS;
    mount.innerHTML = BuilderPrint.estimateBody(doc);
  })();
  </script>
</body>
</html>
